name: Register tools and publish the site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: toolbox-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register new or removed tools in library.json
        run: python3 .github/scripts/sync_library.py
      - name: Save the updated library.json
        run: |
          if ! git diff --quiet -- library.json; then
            git config user.name "toolbox-bot"
            git config user.email "toolbox-bot@users.noreply.github.com"
            git add library.json
            git commit -m "Register tools from tools/ [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
