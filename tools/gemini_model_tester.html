
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{display:flex;flex-direction:column;min-height:500px;padding:1rem 0}
.key-bar{display:flex;gap:8px;align-items:center;margin-bottom:1rem}
.key-bar input{flex:1;font-family:var(--font-mono);font-size:13px}
.key-bar button{white-space:nowrap}
.tabs{display:flex;gap:2px;margin-bottom:1rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.tab{padding:8px 16px;font-size:13px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--color-text-secondary);margin-bottom:-0.5px}
.tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
.tab:hover:not(.active){color:var(--color-text-primary)}
.section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem}
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.model-card{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;cursor:pointer;transition:border-color 0.15s}
.model-card.selected{border-color:#185FA5;background:var(--color-background-info)}
.model-name{font-size:13px;font-weight:500;font-family:var(--font-mono);color:var(--color-text-primary);word-break:break-all}
.model-meta{font-size:11px;color:var(--color-text-secondary);margin-top:4px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin-top:6px;margin-right:4px;font-weight:500}
.badge-blue{background:var(--color-background-info);color:var(--color-text-info)}
.badge-green{background:var(--color-background-success);color:var(--color-text-success)}
.bench-controls{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.bench-controls textarea{flex:1;min-width:200px;font-size:13px;resize:vertical;min-height:60px}
.results-table{width:100%;border-collapse:collapse;font-size:13px}
.results-table th{text-align:left;padding:8px 12px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);font-weight:500;font-size:12px}
.results-table td{padding:8px 12px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top}
.results-table tr:last-child td{border-bottom:none}
.mono{font-family:var(--font-mono)}
.metric{font-size:15px;font-weight:500;font-family:var(--font-mono)}
.metric-good{color:var(--color-text-success)}
.metric-mid{color:var(--color-text-warning)}
.metric-slow{color:var(--color-text-danger)}
.metric-na{color:var(--color-text-secondary)}
.resp-preview{font-size:11px;color:var(--color-text-secondary);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.status-badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;display:inline-block}
.running{background:var(--color-background-warning);color:var(--color-text-warning)}
.done{background:var(--color-background-success);color:var(--color-text-success)}
.err{background:var(--color-background-danger);color:var(--color-text-danger)}
.chat-box{display:flex;flex-direction:column;gap:0;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.chat-header{padding:10px 14px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:300px;max-height:360px}
.msg{padding:10px 14px;border-radius:var(--border-radius-md);font-size:14px;line-height:1.6;max-width:88%;white-space:pre-wrap;word-break:break-word}
.msg-user{background:var(--color-background-info);color:var(--color-text-primary);align-self:flex-end}
.msg-model{background:var(--color-background-secondary);color:var(--color-text-primary);align-self:flex-start}
.msg-error{background:var(--color-background-danger);color:var(--color-text-danger);align-self:flex-start}
.chat-input-row{padding:10px;border-top:0.5px solid var(--color-border-tertiary);display:flex;gap:8px}
.chat-input-row textarea{flex:1;font-size:13px;resize:none;height:60px;font-family:var(--font-sans)}
.empty-state{text-align:center;padding:2rem;color:var(--color-text-secondary);font-size:13px}
.sel-all{font-size:12px;cursor:pointer;color:var(--color-text-info)}
.progress-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary);font-family:var(--font-mono)}
.spinner{width:12px;height:12px;border:1.5px solid var(--color-border-secondary);border-top-color:var(--color-text-primary);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.model-select{font-size:13px;max-width:320px}
.tps{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.full-resp{font-size:12px;color:var(--color-text-secondary);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.resp-modal{position:relative;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;font-size:12px;line-height:1.7;white-space:pre-wrap;margin-top:8px;max-height:200px;overflow-y:auto}
</style>

<div class="app">
  <h2 class="sr-only">Gemini Model Tester — benchmark and chat with all Gemini models</h2>

  <div class="key-bar">
    <i class="ti ti-key" style="font-size:18px;color:var(--color-text-secondary)" aria-hidden="true"></i>
    <input type="password" id="apiKey" placeholder="Paste your Google AI Studio API key here…" autocomplete="off" />
    <button onclick="loadModels()"><i class="ti ti-refresh" aria-hidden="true"></i> Load Models</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-models" onclick="switchTab('models')"><i class="ti ti-cpu" aria-hidden="true"></i> Models</button>
    <button class="tab" id="tab-bench" onclick="switchTab('bench')"><i class="ti ti-chart-bar" aria-hidden="true"></i> Benchmark</button>
    <button class="tab" id="tab-chat" onclick="switchTab('chat')"><i class="ti ti-message" aria-hidden="true"></i> Chat</button>
  </div>

  <div id="pane-models" class="section">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:var(--color-text-secondary)" id="model-count">Enter API key and click Load Models</span>
      <span class="sel-all" id="sel-all-btn" onclick="selectAllForBench()" style="display:none">Select all for benchmark</span>
    </div>
    <div class="model-grid" id="model-grid">
      <div class="empty-state"><i class="ti ti-robot" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>No models loaded yet</div>
    </div>
  </div>

  <div id="pane-bench" class="section" style="display:none">
    <div class="card">
      <div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em">Test prompt</div>
      <div class="bench-controls">
        <textarea id="bench-prompt">Explain quantum entanglement in 3 sentences.</textarea>
        <button onclick="runBenchmark()" id="bench-btn" style="align-self:flex-end"><i class="ti ti-player-play" aria-hidden="true"></i> Run Benchmark</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--color-text-secondary)" id="bench-status"></div>
    <div class="card" id="bench-results-card" style="display:none;overflow-x:auto">
      <table class="results-table" id="bench-table">
        <thead>
          <tr>
            <th>Model</th>
            <th>Status</th>
            <th>TTFT</th>
            <th>Total</th>
            <th>Tokens</th>
            <th>Speed</th>
            <th>Response</th>
          </tr>
        </thead>
        <tbody id="bench-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="pane-chat" class="section" style="display:none">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <label style="font-size:13px;color:var(--color-text-secondary)">Model:</label>
      <select class="model-select" id="chat-model-select" onchange="setChatModel(this.value)">
        <option value="">— select model —</option>
      </select>
      <button onclick="clearChat()" style="margin-left:auto;font-size:12px"><i class="ti ti-trash" aria-hidden="true"></i> Clear chat</button>
    </div>

    <div class="chat-box">
      <div class="chat-header">
        <i class="ti ti-robot" style="font-size:16px;color:var(--color-text-secondary)" aria-hidden="true"></i>
        <span style="font-size:13px;font-weight:500;font-family:var(--font-mono)" id="chat-model-label">No model selected</span>
        <div id="chat-metrics" style="margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary)"></div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="empty-state">Select a model and start chatting</div>
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Type your message… (Enter to send, Shift+Enter for newline)" onkeydown="handleChatKey(event)"></textarea>
        <button onclick="sendChat()" id="chat-send-btn"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = "https://generativelanguage.googleapis.com/v1beta";
let allModels = [];
let benchSelected = new Set();
let chatHistory = [];
let currentChatModel = "";
let expandedRows = new Set();

function getKey() { return document.getElementById("apiKey").value.trim(); }

async function loadModels() {
  const key = getKey();
  if (!key) { alert("Please enter your API key first."); return; }
  document.getElementById("model-count").textContent = "Loading…";
  document.getElementById("model-grid").innerHTML = '<div class="empty-state"><div class="spinner" style="margin:0 auto 8px"></div>Fetching models…</div>';
  try {
    const res = await fetch(`${BASE}/models?key=${key}&pageSize=100`);
    const data = await res.json();
    if (data.error) { document.getElementById("model-count").textContent = "Error: " + data.error.message; document.getElementById("model-grid").innerHTML = '<div class="empty-state">API error — check your key</div>'; return; }
    allModels = (data.models || []).filter(m => m.supportedGenerationMethods?.includes("generateContent"));
    benchSelected = new Set(allModels.map(m => m.name));
    renderModels();
    populateChatSelect();
    document.getElementById("sel-all-btn").style.display = "";
  } catch(e) {
    document.getElementById("model-count").textContent = "Network error";
    document.getElementById("model-grid").innerHTML = '<div class="empty-state">Could not reach Gemini API</div>';
  }
}

function renderModels() {
  const grid = document.getElementById("model-grid");
  document.getElementById("model-count").textContent = `${allModels.length} models support generateContent`;
  if (!allModels.length) { grid.innerHTML = '<div class="empty-state">No models found</div>'; return; }
  grid.innerHTML = allModels.map(m => {
    const shortName = m.name.replace("models/", "");
    const inLimit = m.inputTokenLimit ? `${(m.inputTokenLimit/1000).toFixed(0)}k in` : "";
    const outLimit = m.outputTokenLimit ? `${(m.outputTokenLimit/1000).toFixed(0)}k out` : "";
    const isSel = benchSelected.has(m.name);
    const isStream = m.supportedGenerationMethods?.includes("streamGenerateContent");
    return `<div class="model-card ${isSel?"selected":""}" onclick="toggleBenchSelect('${m.name}', this)" title="Click to toggle in benchmark">
      <div class="model-name">${shortName}</div>
      <div class="model-meta">${m.displayName || ""}</div>
      <div>
        ${inLimit?`<span class="badge badge-blue">${inLimit}</span>`:""}
        ${outLimit?`<span class="badge badge-blue">${outLimit}</span>`:""}
        ${isStream?`<span class="badge badge-green">streaming</span>`:""}
      </div>
    </div>`;
  }).join("");
}

function toggleBenchSelect(name, el) {
  if (benchSelected.has(name)) { benchSelected.delete(name); el.classList.remove("selected"); }
  else { benchSelected.add(name); el.classList.add("selected"); }
}

function selectAllForBench() {
  allModels.forEach(m => benchSelected.add(m.name));
  renderModels();
}

function populateChatSelect() {
  const sel = document.getElementById("chat-model-select");
  sel.innerHTML = '<option value="">— select model —</option>' + allModels.map(m => {
    const shortName = m.name.replace("models/","");
    return `<option value="${m.name}">${shortName}</option>`;
  }).join("");
}

function setChatModel(val) {
  currentChatModel = val;
  document.getElementById("chat-model-label").textContent = val ? val.replace("models/","") : "No model selected";
  clearChat(false);
}

function clearChat(resetModel=true) {
  chatHistory = [];
  const msgs = document.getElementById("chat-messages");
  msgs.innerHTML = '<div class="empty-state">Select a model and start chatting</div>';
  document.getElementById("chat-metrics").textContent = "";
}

function handleChatKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

function appendMsg(role, text) {
  const msgs = document.getElementById("chat-messages");
  const empties = msgs.querySelectorAll(".empty-state");
  empties.forEach(e => e.remove());
  const div = document.createElement("div");
  div.className = role === "user" ? "msg msg-user" : (role === "error" ? "msg msg-error" : "msg msg-model");
  div.id = role === "model" ? "msg-streaming" : "";
  div.textContent = text;
  msgs.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function sendChat() {
  const key = getKey();
  if (!key) { alert("Enter API key first."); return; }
  if (!currentChatModel) { alert("Select a model first."); return; }
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  document.getElementById("chat-send-btn").disabled = true;

  chatHistory.push({ role: "user", parts: [{ text }] });
  appendMsg("user", text);
  const modelDiv = appendMsg("model", "…");
  modelDiv.id = "msg-streaming";

  const t0 = performance.now();
  let ttft = null;
  let fullText = "";
  let totalTokens = 0;

  try {
    const res = await fetch(`${BASE}/${currentChatModel}:streamGenerateContent?key=${key}&alt=sse`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: chatHistory })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const raw = line.slice(6).trim();
        if (raw === "[DONE]") continue;
        try {
          const chunk = JSON.parse(raw);
          const t = chunk?.candidates?.[0]?.content?.parts?.[0]?.text || "";
          if (t && ttft === null) ttft = performance.now() - t0;
          fullText += t;
          modelDiv.textContent = fullText || "…";
          modelDiv.scrollIntoView({ behavior: "smooth", block: "end" });
          if (chunk?.usageMetadata?.candidatesTokenCount) totalTokens = chunk.usageMetadata.candidatesTokenCount;
        } catch {}
      }
    }

    const total = performance.now() - t0;
    chatHistory.push({ role: "model", parts: [{ text: fullText }] });
    modelDiv.id = "";

    const tps = totalTokens && total ? (totalTokens / (total / 1000)).toFixed(1) : "—";
    document.getElementById("chat-metrics").innerHTML =
      `TTFT <b>${ttft ? Math.round(ttft) + "ms" : "—"}</b> &nbsp; Total <b>${Math.round(total)}ms</b> &nbsp; TPS <b>${tps}</b>`;
  } catch (e) {
    modelDiv.className = "msg msg-error";
    modelDiv.textContent = "Error: " + e.message;
    modelDiv.id = "";
  }

  document.getElementById("chat-send-btn").disabled = false;
}

let benchRunning = false;
async function runBenchmark() {
  if (benchRunning) return;
  const key = getKey();
  if (!key) { alert("Enter API key first."); return; }
  if (!benchSelected.size) { alert("Select at least one model in the Models tab."); return; }

  benchRunning = true;
  const btn = document.getElementById("bench-btn");
  btn.disabled = true;
  document.getElementById("bench-results-card").style.display = "";
  const tbody = document.getElementById("bench-tbody");
  tbody.innerHTML = "";
  expandedRows.clear();

  const prompt = document.getElementById("bench-prompt").value.trim() || "Say hello.";
  const selected = allModels.filter(m => benchSelected.has(m.name));
  document.getElementById("bench-status").innerHTML = `<div class="progress-row"><div class="spinner"></div> Running ${selected.length} model(s)…</div>`;

  for (let i = 0; i < selected.length; i++) {
    const m = selected[i];
    const shortName = m.name.replace("models/", "");
    document.getElementById("bench-status").innerHTML = `<div class="progress-row"><div class="spinner"></div> Testing ${shortName} (${i+1}/${selected.length})</div>`;

    const rowId = "brow-" + i;
    const tr = document.createElement("tr");
    tr.id = rowId;
    tr.innerHTML = `<td class="mono" style="font-size:12px;max-width:180px;word-break:break-all">${shortName}</td>
      <td><span class="status-badge running">Running…</span></td>
      <td class="metric metric-na">—</td>
      <td class="metric metric-na">—</td>
      <td class="metric metric-na">—</td>
      <td class="metric metric-na">—</td>
      <td></td>`;
    tbody.appendChild(tr);

    const t0 = performance.now();
    let ttft = null, fullText = "", tokens = 0, errMsg = null;

    try {
      const res = await fetch(`${BASE}/${m.name}:streamGenerateContent?key=${key}&alt=sse`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: { maxOutputTokens: 512 }
        })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (raw === "[DONE]") continue;
          try {
            const chunk = JSON.parse(raw);
            if (chunk.error) { errMsg = chunk.error.message; break; }
            const t = chunk?.candidates?.[0]?.content?.parts?.[0]?.text || "";
            if (t && ttft === null) ttft = performance.now() - t0;
            fullText += t;
            if (chunk?.usageMetadata?.candidatesTokenCount) tokens = chunk.usageMetadata.candidatesTokenCount;
          } catch {}
        }
        if (errMsg) break;
      }
    } catch (e) { errMsg = e.message; }

    const total = Math.round(performance.now() - t0);
    const ttftRnd = ttft ? Math.round(ttft) : null;
    const tps = tokens && total ? (tokens / (total / 1000)).toFixed(1) : null;

    function latClass(ms) {
      if (!ms) return "metric-na";
      if (ms < 500) return "metric-good";
      if (ms < 1500) return "metric-mid";
      return "metric-slow";
    }

    const rowEl = document.getElementById(rowId);
    const uid = "resp-" + i;
    rowEl.innerHTML = `
      <td class="mono" style="font-size:12px;max-width:180px;word-break:break-all">${shortName}</td>
      <td><span class="status-badge ${errMsg ? "err" : "done"}">${errMsg ? "Error" : "Done"}</span></td>
      <td class="${errMsg ? "metric metric-na" : "metric " + latClass(ttftRnd)}">${ttftRnd ? ttftRnd + "ms" : "—"}</td>
      <td class="${errMsg ? "metric metric-na" : "metric " + latClass(total)}">${total}ms</td>
      <td class="metric" style="color:var(--color-text-secondary)">${tokens || "—"}</td>
      <td class="metric" style="color:var(--color-text-secondary)">${tps ? tps + " t/s" : "—"}</td>
      <td>
        ${errMsg ? `<span style="font-size:11px;color:var(--color-text-danger)">${errMsg.slice(0,80)}</span>` :
          `<div class="resp-preview">${fullText.slice(0,80).replace(/\n/g," ")}${fullText.length > 80 ? "…" : ""}</div>
           <span class="full-resp" onclick="toggleResp('${uid}')">show full</span>
           <div class="resp-modal" id="${uid}" style="display:none">${fullText}</div>`}
      </td>`;
  }

  document.getElementById("bench-status").innerHTML = `<span style="color:var(--color-text-success)"><i class="ti ti-check" aria-hidden="true"></i> Done — ${selected.length} model(s) tested</span>`;
  btn.disabled = false;
  benchRunning = false;
}

function toggleResp(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === "none" ? "block" : "none";
}

function switchTab(name) {
  ["models","bench","chat"].forEach(t => {
    document.getElementById("pane-"+t).style.display = t===name ? "" : "none";
    document.getElementById("tab-"+t).classList.toggle("active", t===name);
  });
}
</script>
